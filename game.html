<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>バブルシューター | MyApp</title>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    window.__supabaseCreateClient = createClient;
    window.dispatchEvent(new Event('supabase-ready'));
  </script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c26;
      --border: #2a2a3a;
      --accent: #7c6cfc;
      --accent2: #9b8eff;
      --text: #e8e8f4;
      --muted: #7777a0;
      --success: #56cfad;
      --danger: #f25f5c;
      --gold: #f4c531;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 12px 24px;
      gap: 10px;
      user-select: none;
    }

    /* ── ヘッダー ── */
    .header {
      width: 100%;
      max-width: 380px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-link {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 13px; text-decoration: none;
      padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); transition: color .15s;
    }
    .back-link:hover { color: var(--text); }
    .pts-badge {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 14px;
      font-size: 13px; font-weight: 700;
    }
    .pts-coin { font-size: 16px; }

    /* ── ゲーム外枠 ── */
    .game-shell {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(124,108,252,.12);
    }
    canvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    /* ── 情報バー ── */
    .info-bar {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .info-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }
    .info-tile .it-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .info-tile .it-value { font-size: 20px; font-weight: 800; margin-top: 2px; }

    /* ── オーバーレイ ── */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(8,8,14,.94);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 28px; text-align: center;
    }
    .overlay h2 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    .overlay p  { font-size: 13px; color: var(--muted); line-height: 1.65; max-width: 260px; }
    .big-num { font-size: 56px; font-weight: 900; letter-spacing: -2px; color: var(--accent); line-height: 1; }
    .earn-label { font-size: 15px; font-weight: 700; color: var(--success); }
    .cost-label { font-size: 12px; color: var(--muted); }

    .btn-play {
      padding: 14px 36px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-size: 16px; font-weight: 800; cursor: pointer;
      font-family: inherit; letter-spacing: -.3px;
      transition: transform .1s, opacity .15s;
      box-shadow: 0 4px 20px rgba(124,108,252,.4);
    }
    .btn-play:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .btn-play:active { transform: scale(.97); }
    .btn-play:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-sub {
      padding: 9px 20px; border: 1px solid var(--border);
      border-radius: 9px; background: transparent;
      color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .not-enough { color: var(--danger); font-size: 12px; font-weight: 600; }

    /* ── ログイン案内 ── */
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px 24px; text-align: center;
      max-width: 380px; width: 100%;
    }
    .login-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .login-card p  { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .login-card a  { color: var(--accent); text-decoration: none; font-weight: 600; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── トースト ── */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 18px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
      opacity: 0; transition: transform .25s, opacity .25s;
      pointer-events: none; z-index: 9999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<!-- ── ヘッダー ── -->
<div class="header">
  <a class="back-link" href="index.html">← 戻る</a>
  <div class="pts-badge">
    <span class="pts-coin">🪙</span>
    <span id="pts-disp">—</span> pt

</div>

<!-- ── ログイン案内（未ログイン時） ── -->
<div class="login-card" id="login-card" style="display:none">

<!-- ── ゲーム ── -->
<div class="game-shell" id="game-shell" style="display:none">
  <canvas id="canvas" width="360" height="560"></canvas>

  <!-- スタート画面 -->
  <div class="overlay" id="ov-start">
    <div style="font-size:52px">🫧</div>
    <h2>バブルシューター</h2>
    <p>同じ色のバブルを3つ以上つなげて消そう！<br>バブルを消してポイントを獲得。</p>
    <div class="cost-label">開始コスト：<strong style="color:var(--text)">10 pt</strong></div>

  </div>

  <!-- ゲームオーバー -->
  <div class="overlay" id="ov-over" style="display:none">
    <h2>💥 ゲームオーバー</h2>
    <div class="big-num" id="final-score">0</div>
    <div class="earn-label" id="earn-label">+0 pt 獲得！</div>
    <p id="over-msg">惜しい！次はもっと上手くいけるはず。</p>

  </div>

  <!-- クリア -->
  <div class="overlay" id="ov-clear" style="display:none">
    <div style="font-size:52px">🎉</div>
    <h2>ステージクリア！</h2>
    <div class="big-num" id="clear-score">0</div>
    <div class="earn-label" id="clear-earn">+0 pt 獲得！</div>
    <p>全バブル消去ボーナス +50pt！</p>
    <button class="btn-play" onclick="startGame()">次のゲーム（-10pt）</button>
    <button class="btn-sub" onclick="showStart()">タイトルへ</button>
  </div>
</div>

<!-- ── スコアバー ── -->
<div class="info-bar" id="info-bar" style="display:none">
  <div class="info-tile">
    <div class="it-label">スコア</div>
    <div class="it-value" id="hud-score">0</div>
  </div>
  <div class="info-tile">
    <div class="it-label">残バブル</div>

  </div>
  <div class="info-tile">
    <div class="it-label">次のバブル</div>
    <div class="it-value" id="hud-next">—</div>

</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   設定（index.html と同じ値にしてください）
   ═══════════════════════════════════════════ */
const SUPABASE_URL      = 'https://vnczqksvnkanymagrxbf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuY3pxa3N2bmthbnltYWdyeGJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MDg4MjgsImV4cCI6MjEwMTQ4NDgyOH0.2QFKJshh6Izg0Ch6FbZzNVHlz_-X6hygkITQ79MtmqI';
const PLAY_COST         = 10;  // 開始コスト
const EARN_PER_BUBBLE   = 2;   // バブル1個あたり獲得pt
const CLEAR_BONUS       = 50;  // 全消しボーナス

/* ═══════════════════════════════════════════
   ゲーム定数
   ═══════════════════════════════════════════ */
const W  = 360, H = 560;
const R  = 18;                    // バブル半径
const CW = R * 2 + 2;            // 列幅 38
const RH = Math.round(Math.sqrt(3) * R); // 行高 31
const COLS_EVEN = 9;
const COLS_ODD  = 8;
const GRID_TOP  = 28;
const SHOOTER_Y = H - 52;
const SPEED     = 9;
const DANGER_Y  = H - 110;       // バブルがここを超えたらゲームオーバー

const COLORS = ['#f25f5c','#7c6cfc','#56cfad','#f4a261','#4cc9f0','#e040fb'];
const COLOR_NAMES = ['赤','紫','緑','橙','水','ピンク'];

/* ═══════════════════════════════════════════
   Supabase
   ═══════════════════════════════════════════ */
let sb, userId, userPoints = 0;

const safeStorage = {
  _m: {},
  getItem(k)    { try { return localStorage.getItem(k); } catch { return this._m[k] ?? null; } },
  setItem(k, v) { try { localStorage.setItem(k, v); } catch { this._m[k] = v; } },
  removeItem(k) { try { localStorage.removeItem(k); } catch {} delete this._m[k]; }
};

function initSupabase() {
  const cc = window.__supabaseCreateClient;
  if (!cc) return;
  sb = cc(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: safeStorage, persistSession: true, detectSessionInUrl: true } });
  if (SUPABASE_URL.includes('your-project')) {
    // デモモード
    document.getElementById('game-shell').style.display = 'block';
    document.getElementById('info-bar').style.display   = 'grid';
    document.getElementById('pts-disp').textContent = '∞';
    userPoints = 9999;
    updateStartBtn();
    return;
  }
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) onLogin(session.user);
    else showLoginCard();
  });
  sb.auth.onAuthStateChange((_e, session) => {
    if (session) onLogin(session.user);
    else showLoginCard();
  });
}
window.addEventListener('supabase-ready', initSupabase);
if (window.__supabaseCreateClient) initSupabase();

async function onLogin(user) {
  userId = user.id;
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('game-shell').style.display = 'block';
  document.getElementById('info-bar').style.display   = 'grid';
  await refreshPoints();
  updateStartBtn();
}
function showLoginCard() {
  document.getElementById('login-card').style.display = 'block';
  document.getElementById('game-shell').style.display = 'none';
}
async function refreshPoints() {
  if (!sb || !userId) return;
  const { data } = await sb.from('profiles').select('points').eq('id', userId).maybeSingle();
  userPoints = data?.points ?? 0;
  document.getElementById('pts-disp').textContent = userPoints.toLocaleString();
}
async function spendPoints(amount) {
  if (!sb || !userId) return;
  const next = Math.max(0, userPoints - amount);
  await sb.from('profiles').update({ points: next }).eq('id', userId);
  await sb.from('point_logs').insert({ user_id: userId, amount: -amount, reason: 'バブルシューター（開始）' });
  userPoints = next;
  document.getElementById('pts-disp').textContent = next.toLocaleString();
}
async function earnPoints(amount, reason) {
  if (!sb || !userId || amount <= 0) return;
  const next = userPoints + amount;
  await sb.from('profiles').update({ points: next }).eq('id', userId);
  await sb.from('point_logs').insert({ user_id: userId, amount, reason });
  userPoints = next;
  document.getElementById('pts-disp').textContent = next.toLocaleString();
}
function updateStartBtn() {
  const enough = userPoints >= PLAY_COST;
  document.getElementById('btn-start').disabled  = !enough;
  document.getElementById('btn-retry').disabled  = !enough;
  document.getElementById('no-pts').style.display = enough ? 'none' : 'block';
}

/* ═══════════════════════════════════════════
   グリッド ユーティリティ
   ═══════════════════════════════════════════ */
function colsInRow(r) { return r % 2 === 0 ? COLS_EVEN : COLS_ODD; }

function cellCenter(r, c) {
  const x = r % 2 === 0
    ? R + 1 + c * CW
    : R + 1 + CW / 2 + c * CW;
  const y = GRID_TOP + r * RH + R;
  return { x, y };
}

function nearestCell(px, py) {
  let best = null, bestD = Infinity;
  const rowMin = Math.max(0, Math.floor((py - GRID_TOP - R * 2) / RH));
  const rowMax = Math.min(20, Math.ceil((py - GRID_TOP + R * 2) / RH));
  for (let r = rowMin; r <= rowMax; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      const { x, y } = cellCenter(r, c);
      const d = Math.hypot(px - x, py - y);
      if (d < bestD) { bestD = d; best = { r, c }; }
    }
  }
  return best;
}

function getNeighbors(r, c) {
  if (r % 2 === 0) {
    return [[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]];
  } else {
    return [[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]];
  }
}

function inBounds(r, c) {
  return r >= 0 && c >= 0 && c < colsInRow(r);
}

/* ═══════════════════════════════════════════
   ゲーム状態
   ═══════════════════════════════════════════ */
let grid = [];        // grid[r][c] = colorIdx or -1
let ball  = null;     // { x, y, vx, vy, ci }
let aim   = { x: W/2, y: SHOOTER_Y - 60 };
let shooterColor = 0;
let nextColor    = 0;
let score = 0;
let shotsFired = 0;
let gameActive = false;
let animId = null;

/* ═══════════════════════════════════════════
   ゲーム初期化
   ═══════════════════════════════════════════ */
function buildGrid(rows = 7) {
  const usedColors = Math.min(COLORS.length, Math.max(3, Math.ceil(rows * 0.8)));
  grid = [];
  for (let r = 0; r < rows; r++) {
    const cols = colsInRow(r);
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      grid[r][c] = Math.floor(Math.random() * usedColors);
    }
  }
}

function countBubbles() {
  let n = 0;
  for (let r = 0; r < grid.length; r++)
    for (let c = 0; c < colsInRow(r); c++)
      if (grid[r][c] >= 0) n++;
  return n;
}

/* ═══════════════════════════════════════════
   ゲーム開始 / 終了
   ═══════════════════════════════════════════ */
async function startGame() {
  hideOverlays();
  await spendPoints(PLAY_COST);
  updateStartBtn();
  score      = 0;
  shotsFired = 0;
  gameActive = true;
  buildGrid(7);
  shooterColor = Math.floor(Math.random() * COLORS.length);
  nextColor    = Math.floor(Math.random() * COLORS.length);
  ball = null;
  updateHUD();
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function gameOver() {
  gameActive = false;
  const earned = Math.floor(score / 3);
  earnPoints(earned, `バブルシューター スコア${score}`);
  document.getElementById('final-score').textContent = score;
  document.getElementById('earn-label').textContent  = `+${earned} pt 獲得！`;
  document.getElementById('over-msg').textContent    =
    score > 200 ? '素晴らしい！' : score > 80 ? '惜しい！次は頑張ろう。' : '練習あるのみ！';
  document.getElementById('ov-over').style.display = 'flex';
  refreshPoints();
}

function stageClear() {
  gameActive = false;
  const earned = Math.floor(score / 3) + CLEAR_BONUS;
  earnPoints(earned, `バブルシューター 全消し！スコア${score}`);
  document.getElementById('clear-score').textContent = score;
  document.getElementById('clear-earn').textContent  = `+${earned} pt 獲得！`;
  document.getElementById('ov-clear').style.display  = 'flex';
  refreshPoints();
}

function showStart() {
  hideOverlays();
  document.getElementById('ov-start').style.display = 'flex';
  updateStartBtn();
}
function hideOverlays() {
  ['ov-start','ov-over','ov-clear'].forEach(id => document.getElementById(id).style.display = 'none');
}

/* ═══════════════════════════════════════════
   HUD更新
   ═══════════════════════════════════════════ */
function updateHUD() {
  document.getElementById('hud-score').textContent   = score;
  document.getElementById('hud-bubbles').textContent = countBubbles();
  document.getElementById('hud-next').innerHTML      =
    `<span style="color:${COLORS[nextColor]};font-size:22px">●</span>`;
}

/* ═══════════════════════════════════════════
   射出
   ═══════════════════════════════════════════ */
function shoot() {
  if (!gameActive || ball) return;
  const dx = aim.x - W / 2;
  const dy = aim.y - SHOOTER_Y;
  const len = Math.hypot(dx, dy) || 1;
  // 下向きには撃てない
  if (dy >= -10) return;
  ball = {
    x: W / 2, y: SHOOTER_Y,
    vx: (dx / len) * SPEED,
    vy: (dy / len) * SPEED,
    ci: shooterColor
  };
  shooterColor = nextColor;
  nextColor    = Math.floor(Math.random() * COLORS.length);
  shotsFired++;
}

/* ═══════════════════════════════════════════
   物理 & 衝突
   ═══════════════════════════════════════════ */
function stepBall() {
  if (!ball) return;
  ball.x += ball.vx;
  ball.y += ball.vy;

  // 左右壁反射
  if (ball.x - R < 0)  { ball.x = R;     ball.vx = Math.abs(ball.vx);  }
  if (ball.x + R > W)  { ball.x = W - R; ball.vx = -Math.abs(ball.vx); }

  // 上壁 → スナップ
  if (ball.y - R < GRID_TOP) {
    snapBall(ball.x, GRID_TOP + R);
    return;
  }

  // バブルとの衝突
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      if (grid[r][c] < 0) continue;
      const { x, y } = cellCenter(r, c);
      if (Math.hypot(ball.x - x, ball.y - y) < R * 1.85) {
        snapBall(ball.x, ball.y);
        return;
      }
    }
  }
}

function snapBall(px, py) {
  // 最近傍セルを探す（空セル優先）
  let best = null, bestD = Infinity;
  const r0 = Math.max(0, Math.floor((py - GRID_TOP) / RH) - 1);
  const r1 = r0 + 3;
  for (let r = r0; r <= r1; r++) {
    if (!grid[r]) grid[r] = new Array(colsInRow(r)).fill(-1);
    for (let c = 0; c < colsInRow(r); c++) {
      if (grid[r][c] >= 0) continue; // 埋まっているセルはスキップ
      const { x, y } = cellCenter(r, c);
      const d = Math.hypot(px - x, py - y);
      if (d < bestD) { bestD = d; best = { r, c }; }
    }
  }
  if (!best) { ball = null; return; }

  grid[best.r][best.c] = ball.ci;
  ball = null;

  // マッチ判定
  const matched = findMatches(best.r, best.c);
  if (matched.length >= 3) {
    matched.forEach(([r,c]) => { grid[r][c] = -1; });
    score += matched.length * 10;
    // フロートバブル除去
    const floaters = findFloating();
    floaters.forEach(([r,c]) => { grid[r][c] = -1; });
    score += floaters.length * 5;
    showToast(`🫧 ${matched.length + floaters.length}個消去！ +${matched.length*10 + floaters.length*5}pt`);
  }

  trimEmptyRows();
  updateHUD();

  // クリア判定
  if (countBubbles() === 0) { stageClear(); return; }

  // ゲームオーバー判定（バブルが危険ラインを超えた）
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      if (grid[r][c] < 0) continue;
      const { y } = cellCenter(r, c);
      if (y + R > DANGER_Y) { gameOver(); return; }
    }
  }
}

/* ═══════════════════════════════════════════
   マッチ検出（BFS）
   ═══════════════════════════════════════════ */
function findMatches(sr, sc) {
  const color = grid[sr]?.[sc];
  if (color == null || color < 0) return [];
  const visited = new Set();
  const queue   = [[sr, sc]];
  const result  = [];
  while (queue.length) {
    const [r, c] = queue.shift();
    const key = r * 100 + c;
    if (visited.has(key)) continue;
    if (!inBounds(r, c) || grid[r]?.[c] !== color) continue;
    visited.add(key);
    result.push([r, c]);
    getNeighbors(r, c).forEach(([nr, nc]) => queue.push([nr, nc]));
  }
  return result;
}

/* ═══════════════════════════════════════════
   浮いているバブルを検出
   ═══════════════════════════════════════════ */
function findFloating() {
  // 上端に接続されているバブルをBFS
  const visited = new Set();
  const queue = [];
  if (grid[0]) {
    for (let c = 0; c < colsInRow(0); c++) {
      if (grid[0][c] >= 0) { queue.push([0, c]); visited.add(c); }
    }
  }
  while (queue.length) {
    const [r, c] = queue.shift();
    for (const [nr, nc] of getNeighbors(r, c)) {
      const key = nr * 100 + nc;
      if (visited.has(key)) continue;
      if (!inBounds(nr, nc) || !grid[nr] || grid[nr][nc] < 0) continue;
      visited.add(key);
      queue.push([nr, nc]);
    }
  }
  const floating = [];
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      if (grid[r][c] >= 0 && !visited.has(r * 100 + c)) {
        floating.push([r, c]);
      }
    }
  }
  return floating;
}

function trimEmptyRows() {
  while (grid.length && grid[grid.length - 1].every(v => v < 0)) grid.pop();
}

/* ═══════════════════════════════════════════
   描画
   ═══════════════════════════════════════════ */
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function drawBubble(x, y, ci, alpha = 1) {
  const color = COLORS[ci];
  ctx.save();
  ctx.globalAlpha = alpha;
  // 影
  ctx.shadowColor = color;
  ctx.shadowBlur  = 8;
  // グラデーション
  const g = ctx.createRadialGradient(x - R*0.3, y - R*0.3, R*0.1, x, y, R);
  g.addColorStop(0, lighten(color, 40));
  g.addColorStop(1, color);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, R - 1, 0, Math.PI * 2);
  ctx.fill();
  // ハイライト
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.arc(x - R*0.28, y - R*0.28, R*0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) + amt);
  const g = Math.min(255, ((n >> 8) & 0xff) + amt);
  const b = Math.min(255, (n & 0xff) + amt);
  return `rgb(${r},${g},${b})`;
}

function drawGrid() {
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      if (grid[r][c] < 0) continue;
      const { x, y } = cellCenter(r, c);
      drawBubble(x, y, grid[r][c]);
    }
  }
}

function drawShooter() {
  // 危険ライン
  ctx.strokeStyle = 'rgba(242,95,92,0.25)';
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(0, DANGER_Y);
  ctx.lineTo(W, DANGER_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // ガイドライン（点線）
  if (gameActive && !ball) {
    const dx = aim.x - W/2;
    const dy = aim.y - SHOOTER_Y;
    const len = Math.hypot(dx, dy) || 1;
    if (dy < -10) {
      const vx = (dx / len);
      const vy = (dy / len);
      let lx = W/2, ly = SHOOTER_Y;
      let tvx = vx, tvy = vy;
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      for (let i = 0; i < 12; i++) {
        const step = 30;
        lx += tvx * step; ly += tvy * step;
        if (lx - R < 0)  { lx = R; tvx = Math.abs(tvx); }
        if (lx + R > W)  { lx = W - R; tvx = -Math.abs(tvx); }
        if (ly < GRID_TOP) break;
        ctx.lineTo(lx, ly);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // シューター台座
  const sx = W / 2;
  const sy = SHOOTER_Y;
  ctx.fillStyle = 'rgba(124,108,252,0.15)';
  ctx.beginPath();
  ctx.arc(sx, sy + 10, 28, 0, Math.PI * 2);
  ctx.fill();

  // 現在のバブル
  drawBubble(sx, sy, shooterColor);

  // NEXTバブル（右下に小さく）
  ctx.save();
  ctx.globalAlpha = 0.7;
  const nx = W - 36, ny = SHOOTER_Y + 8;
  drawBubble(nx, ny, nextColor, 0.7);
  ctx.restore();
  ctx.fillStyle = 'rgba(136,136,160,0.8)';
  ctx.font = '9px Inter, system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('NEXT', nx, ny + R + 11);
}

function drawBall() {
  if (!ball) return;
  drawBubble(ball.x, ball.y, ball.ci);
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // 背景グラデーション
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0c0c14');
  bg.addColorStop(1, '#0a0a10');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawShooter();
  drawBall();
}

/* ═══════════════════════════════════════════
   ゲームループ
   ═══════════════════════════════════════════ */
function loop() {
  if (!gameActive) return;
  stepBall();
  render();
  animId = requestAnimationFrame(loop);
}

/* ═══════════════════════════════════════════
   入力
   ═══════════════════════════════════════════ */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  if (e.touches) {
    return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
  }
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

canvas.addEventListener('mousemove', e => {
  if (!gameActive) return;
  const p = getPos(e);
  aim.x = p.x; aim.y = p.y;
});
canvas.addEventListener('click', e => {
  if (!gameActive) return;
  const p = getPos(e);
  aim.x = p.x; aim.y = p.y;
  shoot();
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!gameActive) return;
  const p = getPos(e);
  aim.x = p.x; aim.y = p.y;
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  shoot();
}, { passive: false });

/* ═══════════════════════════════════════════
   トースト
   ═══════════════════════════════════════════ */
let toastTimer;
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* 最初の描画 */
render();
</script>
</body>
</html>
